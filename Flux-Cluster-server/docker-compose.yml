version: '3.8'

networks:
  flux-net:
    driver: bridge

services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      flux-net:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  orchestrator:
    build: .
    container_name: orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Docker's internal DNS automatically resolves 'redis' to the database container
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flux-net
    volumes:
      # Syncs your local src folder to the container in real-time
      # This prevents you from having to rebuild the image every time you edit code tonight
      - ./src:/app/src

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orchestrator
    networks:
      - flux-net
